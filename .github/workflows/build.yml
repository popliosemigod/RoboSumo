name: build

# Compila o firmware a cada push nas branches principais e em todo PR.
# O binario fica anexado ao run por 30 dias.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Instala o PlatformIO
        run: pip install --upgrade platformio

      - name: Compila
        run: pio run -e esp32c3

      - name: Publica o binario
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/esp32c3/firmware.bin
          retention-days: 30
