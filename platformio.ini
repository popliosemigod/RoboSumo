; =====================================================================
;  ROBO SUMO v3 - PlatformIO
;  src_dir = . mantem o layout da Arduino IDE (RoboSumo.ino na raiz),
;  entao os dois toolchains compilam a mesma pasta sem conflito.
; =====================================================================
[platformio]
src_dir = .

[env:esp32c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

; A porta muda quando a placa e reconectada - por isso nao ha upload_port
; fixo aqui. Para fixar: upload_port = COM5
monitor_speed = 115200

; O C3 SuperMini nao tem chip USB-serial: o USB e nativo do proprio MCU.
; Sem estas duas flags o Serial nao aparece no monitor, e e esse silencio
; que costuma ser confundido com firmware travado no boot.
;
; Em troca, a UART0 (GPIO 20/21) fica livre - e e de la que saem o ECHO
; do HC-SR04 e o pino reservado do receptor do edital.
build_flags =
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; so o sketch e os headers da raiz; docs/ nao entra na build
build_src_filter = +<*.ino> +<*.cpp> -<docs/> -<.pio/>

; Nenhuma biblioteca externa: sensores, ponte H e webserver usam so o
; que vem no core Arduino-ESP32.
