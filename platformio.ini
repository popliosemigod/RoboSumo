; =====================================================================
;  ROBO SUMO - PlatformIO
;  src_dir = . mantem o layout da Arduino IDE (RoboSumo.ino na raiz),
;  entao os dois toolchains compilam a mesma pasta sem conflito.
; =====================================================================
[platformio]
src_dir = .

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; porta detectada automaticamente - a placa troca de COM ao reconectar.
; Para fixar: upload_port = COM5
monitor_speed = 115200
upload_speed  = 921600

; so o sketch e os headers da raiz; docs/ tem HTML e nao entra na build
build_src_filter = +<*.ino> +<*.cpp> -<docs/> -<.pio/>

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    pololu/VL53L0X @ ^1.3.1
