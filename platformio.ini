; =====================================================================
;  ROBO SUMO - PlatformIO
;  src_dir = . mantem o layout da Arduino IDE (RoboSumo.ino na raiz),
;  entao os dois toolchains compilam a mesma pasta sem conflito.
; =====================================================================
[platformio]
src_dir = .

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; porta detectada automaticamente - a placa troca de COM ao reconectar.
; Para fixar: upload_port = COM5
monitor_speed = 115200
upload_speed  = 921600

; so o sketch e os headers da raiz; docs/ tem HTML e nao entra na build
build_src_filter = +<*.ino> +<*.cpp> -<docs/> -<.pio/> -<nano/>

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    pololu/VL53L0X @ ^1.3.1
    crankyoldgit/IRremoteESP8266 @ ^2.8.6

; =====================================================================
;  PORTE PARA ARDUINO NANO  (branch feat/porte-arduino-nano)
;
;  Regressao proposital de controlador, para separar o que era problema
;  de fiacao do que era problema da placa. Compila SO a pasta nano/ -
;  o sketch do ESP32 na raiz fica de fora, e vice-versa.
;
;  Dois ambientes porque o bootloader do Nano tem duas versoes e nao da
;  para saber pelo olho qual clone voce tem. Se `nano` falhar com
;  timeout na gravacao, use `nano_old` (bootloader antigo, 57600 baud):
;
;     pio run -e nano     --target upload
;     pio run -e nano_old --target upload
; =====================================================================
[env:nano]
platform  = atmelavr
board     = nanoatmega328new
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<nano/>
build_flags = -Wall
lib_deps =
    pololu/VL53L0X @ ^1.3.1
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:nano_old]
extends = env:nano
board = nanoatmega328
