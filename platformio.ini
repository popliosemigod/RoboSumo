; =====================================================================
;  ROBO SUMO v2 - PlatformIO
;  src_dir = . mantem o layout da Arduino IDE (RoboSumo.ino na raiz),
;  entao os dois toolchains compilam a mesma pasta sem conflito.
; =====================================================================
[platformio]
src_dir = .

[env:esp32c3]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

; A porta muda quando a placa e reconectada - por isso nao ha upload_port
; fixo aqui. Para fixar: upload_port = COM5
monitor_speed = 115200

; O C3 Mini nao tem chip USB-serial: o USB e nativo do proprio MCU. Sem
; estas duas flags o Serial nao aparece no monitor, e e esse silencio que
; costuma ser confundido com firmware travado no boot.
;
; Em troca, a UART0 (GPIO 20/21) fica livre - e e dela que saem os dois
; pinos usados pelo receptor do juiz e pelo nFAULT.
build_flags =
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; so o sketch e os headers da raiz; docs/ nao entra na build
build_src_filter = +<*.ino> +<*.cpp> -<docs/> -<.pio/>

lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
